#/etc/X11/xorg.conf.d/40-libinput-touchpad.conf
Section "InputClass"
    Identifier "libinput touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"

    # Enable tap-to-click (1-finger = left click)
    Option "Tapping" "on"

    # 2-finger tap = right click, 3-finger tap = middle click
    Option "TappingButtonMap" "lrm"

    # Optional but recommended: natural scrolling (comment out if you don't want it)
    Option "NaturalScrolling" "true"

    # Disable tap-and-drag (set to "true" if you want drag via tap-hold)
    Option "TappingDrag" "false"
EndSection
